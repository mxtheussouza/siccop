name: operational-platform

x-service: &service
  restart: unless-stopped

services:
  database:
    <<: *service
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Development password required}
      POSTGRES_DB: ${POSTGRES_DB:?Database name required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *service
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    <<: *service
    build:
      context: .
      dockerfile: infrastructure/docker/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:?Storage key required}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Storage secret required}
    command: ["server", "/bitnami/minio/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/bitnami/minio/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mc alias set local http://localhost:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc ready local >/dev/null',
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-bootstrap:
    <<: *service
    build:
      context: .
      dockerfile: infrastructure/docker/minio.Dockerfile
    depends_on:
      storage:
        condition: service_healthy
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://storage:9000 "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" >/dev/null
        mc mb --ignore-existing "local/$$STORAGE_BUCKET"
        mc anonymous set none "local/$$STORAGE_BUCKET"
        touch /tmp/bucket-ready
        while true; do sleep 3600; done
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/bucket-ready"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    <<: *service
    profiles: ["worker"]
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://storage:9000
    command:
      [
        "dramatiq",
        "app.worker",
        "--processes",
        "1",
        "--threads",
        "4",
        "--skip-logging",
      ]
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-bootstrap:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    <<: *service
    profiles: ["monitoring"]
    image: prom/prometheus:v3.3.0
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  grafana:
    <<: *service
    profiles: ["monitoring"]
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/datasources.yml:/etc/grafana/provisioning/datasources/default.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  database-data:
  redis-data:
  storage-data:
  prometheus-data:
  grafana-data:
